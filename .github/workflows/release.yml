name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  macos-arm64:
    name: Build macOS arm64 release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vX.Y.Z: ${tag}"
            exit 1
          fi

          echo "VERSION=${tag#v}" >> "${GITHUB_ENV}"
          echo "ASSET_BASE=signalpane-${tag}-${TARGET}" >> "${GITHUB_ENV}"

      - name: Install Rust components
        run: |
          rustup component add rustfmt clippy
          rustup target add "${TARGET}"

      - name: Test
        run: cargo test

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --target "${TARGET}"

      - name: Package release artifact
        run: |
          set -euo pipefail

          mkdir -p dist
          install -m 0755 "target/${TARGET}/release/signalpane" dist/signalpane
          tar -C dist -czf "dist/${ASSET_BASE}.tar.gz" signalpane
          (
            cd dist
            shasum -a 256 "${ASSET_BASE}.tar.gz" > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ASSET_BASE}.tar.gz#signalpane ${GITHUB_REF_NAME} macOS Apple Silicon binary" \
            "dist/SHA256SUMS#SHA256 checksums" \
            --verify-tag \
            --generate-notes

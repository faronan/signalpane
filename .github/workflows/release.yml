name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  macos-arm64:
    name: Build macOS arm64 release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vX.Y.Z: ${tag}"
            exit 1
          fi

          echo "VERSION=${tag#v}" >> "${GITHUB_ENV}"
          echo "ASSET_BASE=signalpane-${tag}-${TARGET}" >> "${GITHUB_ENV}"

      - name: Validate manifest version
        run: |
          set -euo pipefail

          package_id="$(cargo pkgid)"
          manifest_version="${package_id##*#}"
          if [[ "${manifest_version}" != "${VERSION}" ]]; then
            echo "::error::release tag ${GITHUB_REF_NAME} requires Cargo.toml version ${VERSION}, got ${manifest_version}"
            exit 1
          fi

      - name: Install Rust components
        run: |
          rustup component add rustfmt clippy
          rustup target add "${TARGET}"

      - name: Test
        run: cargo test

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --target "${TARGET}"

      - name: Package release artifact
        run: |
          set -euo pipefail

          mkdir -p dist
          install -m 0755 "target/${TARGET}/release/signalpane" dist/signalpane
          tar -C dist -czf "dist/${ASSET_BASE}.tar.gz" signalpane
          (
            cd dist
            shasum -a 256 "${ASSET_BASE}.tar.gz" > SHA256SUMS
          )

      - name: Smoke release artifact
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          smoke_home="$(mktemp -d)"
          smoke_config="$(mktemp -d)"
          smoke_state="$(mktemp -d)"

          (
            cd dist
            shasum -a 256 -c SHA256SUMS
          )

          tar -xzf "dist/${ASSET_BASE}.tar.gz" -C "${smoke_dir}"

          binary="${smoke_dir}/signalpane"
          test -f "${binary}"
          test -x "${binary}"

          "${binary}" --help

          version_output="$("${binary}" --version)"
          expected_version="signalpane ${VERSION}"
          if [[ "${version_output}" != "${expected_version}" ]]; then
            echo "::error::expected ${expected_version}, got ${version_output}"
            exit 1
          fi

          status_output="$(
            HOME="${smoke_home}" \
            XDG_CONFIG_HOME="${smoke_config}" \
            XDG_STATE_HOME="${smoke_state}" \
            SIGNALPANE_GITHUB_TOKEN= \
            SIGNALPANE_SLACK_USER_TOKEN= \
            SIGNALPANE_SLACK_USER_ID= \
            "${binary}" launch-agent status
          )"
          echo "${status_output}"

          grep -Fqx "label=com.faronan.signalpane" <<< "${status_output}"
          grep -Eq '^loaded=(true|false)$' <<< "${status_output}"
          grep -Eq '^daemon_ipc=(responsive|unreachable)$' <<< "${status_output}"
          grep -Fqx "socket_path=${smoke_state}/signalpane/signalpane.sock" <<< "${status_output}"
          grep -Fqx "log_path=${smoke_state}/signalpane/logs/daemon.log" <<< "${status_output}"
          grep -Fqx "plist_path=${smoke_home}/Library/LaunchAgents/com.faronan.signalpane.plist" <<< "${status_output}"
          grep -Fqx "binary_path=${binary}" <<< "${status_output}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ASSET_BASE}.tar.gz#signalpane ${GITHUB_REF_NAME} macOS Apple Silicon binary" \
            "dist/SHA256SUMS#SHA256 checksums" \
            --verify-tag \
            --generate-notes
